name: CI - Build and Test

permissions:
  contents: read

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET ${{ matrix.dotnet-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ["8.0.x", "10.0.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore Microsoft.OpenTelemetry.slnx

      - name: Build solution
        run: dotnet build Microsoft.OpenTelemetry.slnx --no-restore --configuration Release

      - name: Run tests
        id: test1
        continue-on-error: true
        run: dotnet test Microsoft.OpenTelemetry.slnx --no-build --configuration Release --verbosity normal --results-directory ${{ github.workspace }}/TestResults --logger "trx;logfileprefix=testResults_"

      - name: Retry failed tests
        id: test-retry
        if: steps.test1.outcome == 'failure'
        run: pwsh -f ./.scripts/build_RetryTests.ps1 -TestResultsDirectory ${{ github.workspace }}/TestResults -WorkingDirectory ${{ github.workspace }}

      - name: Fail if tests failed after retries
        if: steps.test1.outcome == 'failure' && steps.test-retry.outcome == 'failure'
        run: |
          echo "::error::Tests failed after retries"
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-net${{ matrix.dotnet-version }}
          path: |
            ${{ github.workspace }}/TestResults/**/*.trx
            ${{ github.workspace }}/RetryResults/**/*.trx
          retention-days: 30

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Microsoft.OpenTelemetry.slnx

      - name: Build
        run: dotnet build Microsoft.OpenTelemetry.slnx --no-restore --configuration Release

      - name: Pack
        run: |
          dotnet pack src/Microsoft.Agents.A365.Observability.Contracts/Microsoft.Agents.A365.Observability.Contracts.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Microsoft.Agents.A365.Observability.Etw/Microsoft.Agents.A365.Observability.Etw.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Microsoft.OpenTelemetry/Microsoft.OpenTelemetry.csproj --no-build --configuration Release --output ./packages

      - name: Validate package consumers
        run: |
          dotnet restore test/package-smoke/StandaloneEtwConsumer/StandaloneEtwConsumer.csproj --source ./packages --source https://api.nuget.org/v3/index.json
          dotnet build test/package-smoke/StandaloneEtwConsumer/StandaloneEtwConsumer.csproj --no-restore --configuration Release
          dotnet restore test/package-smoke/DistroConsumer/DistroConsumer.csproj --source ./packages --source https://api.nuget.org/v3/index.json
          dotnet build test/package-smoke/DistroConsumer/DistroConsumer.csproj --no-restore --configuration Release

      - name: Assert package consumer outputs
        shell: pwsh
        run: |
          function Assert-ConsumerOutput {
            param(
              [string] $ProjectName,
              [string[]] $MustContain,
              [string[]] $MustNotContain
            )

            $outputPath = Join-Path $env:GITHUB_WORKSPACE "target/bin/$ProjectName/Release/net8.0"
            if (-not (Test-Path -LiteralPath $outputPath -PathType Container)) {
              throw "Expected consumer output directory was not created: $outputPath"
            }

            $outputFiles = Get-ChildItem -LiteralPath $outputPath -File | Select-Object -ExpandProperty Name

            foreach ($fileName in $MustContain) {
              if ($fileName -notin $outputFiles) {
                throw "Expected '$fileName' in $outputPath. Found: $($outputFiles -join ', ')"
              }
            }

            foreach ($fileName in $MustNotContain) {
              if ($fileName -in $outputFiles) {
                throw "Did not expect '$fileName' in $outputPath. Found: $($outputFiles -join ', ')"
              }
            }
          }

          Assert-ConsumerOutput `
            -ProjectName StandaloneEtwConsumer `
            -MustContain @(
              'Microsoft.Agents.A365.Observability.Etw.dll',
              'Microsoft.Agents.A365.Observability.Contracts.dll'
            ) `
            -MustNotContain @('Microsoft.OpenTelemetry.dll')

          Assert-ConsumerOutput `
            -ProjectName DistroConsumer `
            -MustContain @(
              'Microsoft.Agents.A365.Observability.Etw.dll',
              'Microsoft.Agents.A365.Observability.Contracts.dll',
              'Microsoft.OpenTelemetry.dll'
            ) `
            -MustNotContain @()

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg
          retention-days: 30
