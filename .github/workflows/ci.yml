name: CI - Build and Test

permissions:
  contents: read

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET ${{ matrix.dotnet-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ["8.0.x", "10.0.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore Microsoft.OpenTelemetry.slnx

      - name: Build solution
        run: dotnet build Microsoft.OpenTelemetry.slnx --no-restore --configuration Release

      - name: Run tests
        id: test1
        continue-on-error: true
        run: dotnet test Microsoft.OpenTelemetry.slnx --no-build --configuration Release --verbosity normal --results-directory ${{ github.workspace }}/TestResults --logger "trx;logfileprefix=testResults_"

      - name: Retry failed tests
        id: test-retry
        if: steps.test1.outcome == 'failure'
        run: pwsh -f ./.scripts/build_RetryTests.ps1 -TestResultsDirectory ${{ github.workspace }}/TestResults -WorkingDirectory ${{ github.workspace }}

      - name: Fail if tests failed after retries
        if: steps.test1.outcome == 'failure' && steps.test-retry.outcome == 'failure'
        run: |
          echo "::error::Tests failed after retries"
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-net${{ matrix.dotnet-version }}
          path: |
            ${{ github.workspace }}/TestResults/**/*.trx
            ${{ github.workspace }}/RetryResults/**/*.trx
          retention-days: 30

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Only the smoke packages get a unique CI version. The release packages that are uploaded as
      # artifacts keep the repository version (A365ObservabilityPackageVersion in Directory.Build.props)
      # so the artifacts are exactly what would be published.
      - name: Compute smoke package version
        id: smoke-version
        shell: bash
        run: echo "version=1.2.0-ci.${{ github.run_id }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Microsoft.OpenTelemetry.slnx

      - name: Build
        run: dotnet build Microsoft.OpenTelemetry.slnx --no-restore --configuration Release

      - name: Pack release packages
        run: |
          dotnet pack src/Microsoft.Agents.A365.Observability.Contracts/Microsoft.Agents.A365.Observability.Contracts.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Microsoft.Agents.A365.Observability.Etw/Microsoft.Agents.A365.Observability.Etw.csproj --no-build --configuration Release --output ./packages
          dotnet pack src/Microsoft.OpenTelemetry/Microsoft.OpenTelemetry.csproj --no-build --configuration Release --output ./packages

      # Repack the same build output into a separate directory under a unique prerelease version. The
      # smoke consumers restore only from ./smoke-packages at that exact version, so the validation can
      # never silently resolve an already-published package from nuget.org.
      - name: Pack smoke packages
        run: |
          dotnet pack src/Microsoft.Agents.A365.Observability.Contracts/Microsoft.Agents.A365.Observability.Contracts.csproj --no-build --configuration Release --output ./smoke-packages -p:Version=${{ steps.smoke-version.outputs.version }}
          dotnet pack src/Microsoft.Agents.A365.Observability.Etw/Microsoft.Agents.A365.Observability.Etw.csproj --no-build --configuration Release --output ./smoke-packages -p:Version=${{ steps.smoke-version.outputs.version }}
          dotnet pack src/Microsoft.OpenTelemetry/Microsoft.OpenTelemetry.csproj --no-build --configuration Release --output ./smoke-packages -p:Version=${{ steps.smoke-version.outputs.version }}

      # Restore the smoke consumers against the exact version that was just packed locally, with the
      # NuGet HTTP cache bypassed. nuget.org stays in the source list for the external dependencies.
      - name: Validate package consumers
        run: |
          dotnet restore test/package-smoke/StandaloneEtwConsumer/StandaloneEtwConsumer.csproj --source ./smoke-packages --source https://api.nuget.org/v3/index.json --no-cache -p:SmokePackageVersion=${{ steps.smoke-version.outputs.version }}
          dotnet build test/package-smoke/StandaloneEtwConsumer/StandaloneEtwConsumer.csproj --no-restore --configuration Release -p:SmokePackageVersion=${{ steps.smoke-version.outputs.version }}
          dotnet restore test/package-smoke/DistroConsumer/DistroConsumer.csproj --source ./smoke-packages --source https://api.nuget.org/v3/index.json --no-cache -p:SmokePackageVersion=${{ steps.smoke-version.outputs.version }}
          dotnet build test/package-smoke/DistroConsumer/DistroConsumer.csproj --no-restore --configuration Release -p:SmokePackageVersion=${{ steps.smoke-version.outputs.version }}

      - name: Assert package consumer outputs
        shell: pwsh
        env:
          SMOKE_PACKAGE_VERSION: ${{ steps.smoke-version.outputs.version }}
        run: |
          function Assert-ResolvedPackageVersion {
            param(
              [string] $ProjectName,
              [string] $PackageId
            )

            $assetsPath = Join-Path $env:GITHUB_WORKSPACE "target/obj/$ProjectName/project.assets.json"
            if (-not (Test-Path -LiteralPath $assetsPath -PathType Leaf)) {
              throw "Expected restore assets file was not created: $assetsPath"
            }

            $assets = Get-Content -LiteralPath $assetsPath -Raw | ConvertFrom-Json
            $libraryIds = $assets.libraries.PSObject.Properties.Name
            $expected = "$PackageId/$env:SMOKE_PACKAGE_VERSION"
            if ($libraryIds -notcontains $expected) {
              $actual = $libraryIds | Where-Object { $_ -like "$PackageId/*" }
              throw "Expected '$expected' in $assetsPath. Found: $($actual -join ', ')"
            }
          }

          function Assert-ConsumerOutput {
            param(
              [string] $ProjectName,
              [string[]] $MustContain,
              [string[]] $MustNotContain
            )

            $outputPath = Join-Path $env:GITHUB_WORKSPACE "target/bin/$ProjectName/Release/net8.0"
            if (-not (Test-Path -LiteralPath $outputPath -PathType Container)) {
              throw "Expected consumer output directory was not created: $outputPath"
            }

            $outputFiles = Get-ChildItem -LiteralPath $outputPath -File | Select-Object -ExpandProperty Name

            foreach ($fileName in $MustContain) {
              if ($fileName -notin $outputFiles) {
                throw "Expected '$fileName' in $outputPath. Found: $($outputFiles -join ', ')"
              }
            }

            foreach ($fileName in $MustNotContain) {
              if ($fileName -in $outputFiles) {
                throw "Did not expect '$fileName' in $outputPath. Found: $($outputFiles -join ', ')"
              }
            }
          }

          Assert-ResolvedPackageVersion -ProjectName StandaloneEtwConsumer -PackageId 'Microsoft.Agents.A365.Observability.Etw'
          Assert-ResolvedPackageVersion -ProjectName StandaloneEtwConsumer -PackageId 'Microsoft.Agents.A365.Observability.Contracts'
          Assert-ResolvedPackageVersion -ProjectName DistroConsumer -PackageId 'Microsoft.OpenTelemetry'
          Assert-ResolvedPackageVersion -ProjectName DistroConsumer -PackageId 'Microsoft.Agents.A365.Observability.Etw'
          Assert-ResolvedPackageVersion -ProjectName DistroConsumer -PackageId 'Microsoft.Agents.A365.Observability.Contracts'

          Assert-ConsumerOutput `
            -ProjectName StandaloneEtwConsumer `
            -MustContain @(
              'Microsoft.Agents.A365.Observability.Etw.dll',
              'Microsoft.Agents.A365.Observability.Contracts.dll'
            ) `
            -MustNotContain @('Microsoft.OpenTelemetry.dll')

          Assert-ConsumerOutput `
            -ProjectName DistroConsumer `
            -MustContain @(
              'Microsoft.Agents.A365.Observability.Etw.dll',
              'Microsoft.Agents.A365.Observability.Contracts.dll',
              'Microsoft.OpenTelemetry.dll'
            ) `
            -MustNotContain @()

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg
          retention-days: 30